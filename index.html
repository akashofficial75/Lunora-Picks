    <!-- System theme detection & manual preference persistence -->
    <script>
      (function() {
        function getResolvedTheme(e) {
          try {
            var stored = localStorage.getItem('lunora_theme');
            if (stored === 'dark' || stored === 'light') {
              return stored;
            }
            var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
            var isDark = (e && typeof e.matches === 'boolean') ? e.matches : (mq ? mq.matches : true);
            return isDark ? 'dark' : 'light';
          } catch (err) {
            return 'dark';
          }
        }

        function applyTheme(theme) {
          try {
            var html = document.documentElement;
            if (theme === 'dark') {
              html.classList.add('dark');
              html.classList.remove('light');
              html.setAttribute('data-theme', 'dark');
            } else {
              html.classList.remove('dark');
              html.classList.add('light');
              html.setAttribute('data-theme', 'light');
            }
          } catch (err) {}
        }

        applyTheme(getResolvedTheme());

        try {
          if (window.matchMedia) {
            var mql = window.matchMedia('(prefers-color-scheme: dark)');
            var handler = function(e) {
              if (!localStorage.getItem('lunora_theme')) {
                applyTheme(getResolvedTheme(e));
              }
            };
            if (mql.addEventListener) {
              mql.addEventListener('change', handler);
            } else if (mql.addListener) {
              mql.addListener(handler);
            }
          }
        } catch (err) {}
      })();
    </script>
